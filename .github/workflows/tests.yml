name: Testes e seguranca

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goatskins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goatskins_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/goatskins_test
      # Credenciais fictícias, usadas exclusivamente no banco descartável acima.
      DATABASE_SSL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias do lockfile
        run: npm ci --ignore-scripts
      - name: Verificar dependencias de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Procurar formatos conhecidos de segredos sem exibir valores
        run: node scripts/verificar-segredos.js
      - name: Executar suite completa com PostgreSQL real
        run: npm run test:ci
