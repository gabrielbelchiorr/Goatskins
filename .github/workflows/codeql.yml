name: CodeQL manual

# Opt-in: public repositories are eligible; private repositories require GitHub
# Code Security and may consume billed Actions minutes. Confirm eligibility and
# activate advanced setup before running. This workflow was not executed locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inicializar analise JavaScript
        uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analisar e registrar alertas no GitHub Security
        uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          category: /language:javascript-typescript
          upload-database: false
